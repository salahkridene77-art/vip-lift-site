<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-label="Trois profils de fosse pour un Home Lift" style="font-family:'Plus Jakarta Sans',Arial,sans-serif">
<title>Trois profils de fosse pour un Home Lift</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6ebf1"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa6b5" stroke-width="1.6"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1630"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6391"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9d5b"/></marker></defs>
<rect width="480" height="560" rx="18" fill="#fff"/>
<text x="24" y="36" font-size="18" font-weight="700" fill="#0b1630" text-anchor="start">Fosse standard</text><text x="24" y="58" font-size="14.5" font-weight="500" fill="#5b6678" text-anchor="start">Profondeur selon le modèle de Home Lift</text><path d="M30 128 H170 V158 H310 V128 H450 V172 H30Z" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><line x1="330" y1="128" x2="330" y2="158" stroke="#0b6391" stroke-width="2" marker-start="url(#arb)" marker-end="url(#arb)"/><text x="346" y="149.0" font-size="17" font-weight="700" fill="#0b6391" text-anchor="start">6–15 cm</text><line x1="20" y1="186" x2="460" y2="186" stroke="#c9d3df"/><text x="24" y="220" font-size="18" font-weight="700" fill="#0b1630" text-anchor="start">Sans fosse</text><text x="24" y="242" font-size="14.5" font-weight="500" fill="#5b6678" text-anchor="start">Pose sur le sol fini, accès par une rampe</text><rect x="30" y="312" width="420" height="40" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><path d="M150 312 V254" stroke="#5b6678" stroke-width="3"/><path d="M150 312 H190 L300 312 V312 L190 294 H150Z" fill="#d9ecf7" stroke="#0b6391" stroke-width="2"/><line x1="318" y1="294" x2="318" y2="312" stroke="#0b6391" stroke-width="2" marker-start="url(#arb)" marker-end="url(#arb)"/><text x="334" y="309.0" font-size="17" font-weight="700" fill="#0b6391" text-anchor="start">5 cm</text><text x="160" y="286" font-size="13" font-weight="600" fill="#0b6391" text-anchor="start">rampe</text><line x1="20" y1="370" x2="460" y2="370" stroke="#c9d3df"/><text x="24" y="404" font-size="18" font-weight="700" fill="#0b1630" text-anchor="start">Sol personnalisé</text><text x="24" y="426" font-size="14.5" font-weight="500" fill="#5b6678" text-anchor="start">Fosse plus profonde pour votre propre revêtement</text><path d="M30 496 H170 V536 H310 V496 H450 V548 H30Z" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><rect x="172" y="524" width="136" height="10" fill="#c79a62"/><text x="240" y="518" font-size="12.5" font-weight="600" fill="#8a5a22" text-anchor="middle">votre revêtement</text><line x1="330" y1="496" x2="330" y2="536" stroke="#0b6391" stroke-width="2" marker-start="url(#arb)" marker-end="url(#arb)"/><text x="346" y="522.0" font-size="17" font-weight="700" fill="#0b6391" text-anchor="start">8–9 cm</text></svg>