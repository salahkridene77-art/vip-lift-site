<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 494" role="img" aria-label="Étapes de montage d'un Home Lift" style="font-family:'Plus Jakarta Sans',Arial,sans-serif">
<title>Étapes de montage d'un Home Lift</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6ebf1"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa6b5" stroke-width="1.6"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1630"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6391"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9d5b"/></marker></defs>
<rect width="480" height="494" rx="18" fill="#fff"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">Montage sur site : 7 à 12 jours en moyenne</text><text x="24" y="60" font-size="14" font-weight="500" fill="#5b6678" text-anchor="start">selon la taille de l’ascenseur et la complexité du chantier</text><circle cx="52" cy="96" r="20" fill="#0b6391"/><text x="52" y="102" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="52" y1="118" x2="52" y2="140" stroke="#c9d3df" stroke-width="3"/><text x="88" y="102" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Livraison et déballage</text><circle cx="52" cy="162" r="20" fill="#0b6391"/><text x="52" y="168" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="52" y1="184" x2="52" y2="206" stroke="#c9d3df" stroke-width="3"/><text x="88" y="168" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Rails de guidage</text><circle cx="52" cy="228" r="20" fill="#0b6391"/><text x="52" y="234" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="52" y1="250" x2="52" y2="272" stroke="#c9d3df" stroke-width="3"/><text x="88" y="234" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Plateforme et machinerie</text><circle cx="52" cy="294" r="20" fill="#0b6391"/><text x="52" y="300" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="52" y1="316" x2="52" y2="338" stroke="#c9d3df" stroke-width="3"/><text x="88" y="300" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Montage de la gaine</text><circle cx="52" cy="360" r="20" fill="#0b6391"/><text x="52" y="366" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="88" y="366" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Essais et mise en service</text><rect x="24" y="420" width="432" height="58" rx="12" fill="#eef3f8"/><text x="40" y="445" font-size="14" font-weight="600" fill="#0b1630" text-anchor="start">Pendant le chantier : sols protégés, zone isolée</text><text x="40" y="466" font-size="14" font-weight="600" fill="#0b1630" text-anchor="start">contre la poussière, gaine faite sur mesure.</text></svg>