<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" role="img" aria-label="Arrivées électriques et téléphoniques dans la fosse" style="font-family:'Plus Jakarta Sans',Arial,sans-serif">
<title>Arrivées électriques et téléphoniques dans la fosse</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6ebf1"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa6b5" stroke-width="1.6"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1630"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6391"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9d5b"/></marker></defs>
<rect width="480" height="530" rx="18" fill="#fff"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">Option A — par le fond de fosse</text><text x="24" y="60" font-size="14.5" font-weight="500" fill="#5b6678" text-anchor="start">Vue de dessus de la fosse</text><rect x="60" y="80" width="250" height="176" fill="#eef3f8" stroke="#0b1630" stroke-width="2"/><rect x="110" y="104" width="150" height="34" fill="#cfeedd" stroke="#2e9d5b" stroke-width="2"/><text x="185" y="126" font-size="13.5" font-weight="700" fill="#2e9d5b" text-anchor="middle">zone de sortie</text><line x1="60" y1="156" x2="110" y2="156" stroke="#0b6391" stroke-width="2" marker-start="url(#arb)" marker-end="url(#arb)"/><text x="85" y="174" font-size="13" font-weight="700" fill="#0b6391" text-anchor="middle">10 cm</text><line x1="260" y1="156" x2="310" y2="156" stroke="#0b6391" stroke-width="2" marker-start="url(#arb)" marker-end="url(#arb)"/><text x="285" y="174" font-size="13" font-weight="700" fill="#0b6391" text-anchor="middle">10 cm</text><text x="185" y="224" font-size="15" font-weight="600" fill="#5b6678" text-anchor="middle">fosse</text><text x="185" y="96" font-size="12" font-weight="700" fill="#0b1630" text-anchor="middle">côté machinerie</text><text x="330" y="180" font-size="14" font-weight="700" fill="#0b1630" text-anchor="start">Câbles : sortie</text><text x="330" y="198" font-size="14" font-weight="500" fill="#0b1630" text-anchor="start">d’au moins</text><text x="330" y="216" font-size="16" font-weight="700" fill="#2e9d5b" text-anchor="start">15 cm</text><line x1="20" y1="272" x2="460" y2="272" stroke="#c9d3df"/><text x="24" y="306" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">Option B — par le haut</text><path d="M80 330 C 60 360, 120 380, 100 410 S 60 450, 120 470" fill="none" stroke="#0b1630" stroke-width="4"/><path d="M130 470 L240 430 L400 470 L290 510Z" fill="#eef3f8" stroke="#0b1630" stroke-width="2"/><path d="M240 450 L330 476 L300 488 L210 462Z" fill="#cfeedd"/><text x="250" y="340" font-size="14.5" font-weight="700" fill="#0b1630" text-anchor="start">Câbles assez longs</text><text x="250" y="360" font-size="14.5" font-weight="500" fill="#0b1630" text-anchor="start">pour atteindre la zone</text><text x="250" y="380" font-size="14.5" font-weight="700" fill="#2e9d5b" text-anchor="start">de sortie + 3 m de réserve</text></svg>