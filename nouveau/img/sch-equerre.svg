<rect width="480" height="410" rx="18" fill="#fff"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">Vue de dessus : la fosse est-elle d'équerre ?</text><circle cx="40" cy="74" r="13" fill="#2e9d5b"/><text x="40" y="80" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="62" y="80" font-size="16" font-weight="700" fill="#2e9d5b" text-anchor="start">Bon</text><rect x="40" y="96" width="170" height="104" fill="#eef3f8" stroke="#2e9d5b" stroke-width="3"/><path d="M56 96 V112 H40" fill="none" stroke="#2e9d5b" stroke-width="2"/><path d="M194 96 V112 H210" fill="none" stroke="#2e9d5b" stroke-width="2"/><path d="M56 200 V184 H40" fill="none" stroke="#2e9d5b" stroke-width="2"/><path d="M194 200 V184 H210" fill="none" stroke="#2e9d5b" stroke-width="2"/><text x="125" y="154" font-size="15" font-weight="700" fill="#2e9d5b" text-anchor="middle">angles à 90°</text><circle cx="270" cy="74" r="13" fill="#d0453b"/><text x="270" y="80" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="292" y="80" font-size="16" font-weight="700" fill="#d0453b" text-anchor="start">À éviter</text><path d="M290 96 H440 L420 200 H270Z" fill="#fbecea" stroke="#d0453b" stroke-width="3"/><text x="355" y="154" font-size="15" font-weight="700" fill="#d0453b" text-anchor="middle">parallélogramme</text><line x1="20" y1="232" x2="460" y2="232" stroke="#c9d3df"/><text x="24" y="266" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">En coupe : le fond est-il de niveau ?</text><circle cx="40" cy="300" r="13" fill="#2e9d5b"/><text x="40" y="306" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="62" y="306" font-size="16" font-weight="700" fill="#2e9d5b" text-anchor="start">Bon</text><path d="M30 326 H52 V356 H190 V326 H212 V380 H30Z" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><line x1="52" y1="356" x2="190" y2="356" stroke="#2e9d5b" stroke-width="4"/><text x="121" y="346" font-size="14" font-weight="700"