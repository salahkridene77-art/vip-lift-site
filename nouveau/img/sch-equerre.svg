<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6ebf1"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa6b5" stroke-width="1.6"/></pattern>
