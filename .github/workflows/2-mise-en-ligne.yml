name: 2 - Mise en ligne (nouvelle page d'accueil)
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez OUI pour mettre la nouvelle page en ligne"
        required: true
jobs:
  bascule:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirmation == 'OUI' }}
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Sauvegarder le .htaccess actuel et la liste des fichiers
        run: |
          mkdir -p sauvegarde
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; cd viplift; cls -1a > ../sauvegarde/liste-www.txt; get -e .htaccess -o sauvegarde/htaccess-avant.txt" || true
          touch sauvegarde/htaccess-avant.txt
          cat sauvegarde/liste-www.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-avant-mise-en-ligne
          path: sauvegarde/
          retention-days: 90
      - name: Vérifier qu'aucun fichier existant ne sera écrasé
        run: |
          if ! grep -qx ".vip-lift-site" sauvegarde/liste-www.txt; then
            for f in index.html style.css script.js liens.js devis-api.php img/; do
              if grep -qx "$f" sauvegarde/liste-www.txt || grep -qx "${f%/}" sauvegarde/liste-www.txt; then
                echo "::error title=Arrêt::viplift/$f existe déjà sur le site. Rien n'a été modifié."; exit 1
              fi
            done
          fi
      - name: Préparer le nouveau .htaccess
        run: |
          sed '/# BEGIN VIP Lift/,/# END VIP Lift/d' sauvegarde/htaccess-avant.txt > htaccess-sans-bloc.txt
          { cat mise-en-ligne/A-AJOUTER-EN-HAUT-DU-HTACCESS.txt; echo; cat htaccess-sans-bloc.txt; } > htaccess-nouveau.txt
          head -12 htaccess-nouveau.txt
          echo "::notice title=Sauvegarde::.htaccess d'origine sauvegardé ($(wc -l < sauvegarde/htaccess-avant.txt) lignes)"
      - name: Envoyer les fichiers et activer la nouvelle page
        run: |
          echo "fichiers VIP Lift" > marqueur.txt
          set +e
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mirror -R --verbose --no-perms --exclude-glob A-AJOUTER-EN-HAUT-DU-HTACCESS.txt mise-en-ligne viplift; put marqueur.txt -o viplift/.vip-lift-site; put htaccess-nouveau.txt -o viplift/.htaccess" > envoi.log 2>&1
          code=$?; cat envoi.log
          if [ $code -ne 0 ]; then echo "::error title=Envoi FTP::$(tail -6 envoi.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Envoi FTP::$(grep -c 'Transferring file' envoi.log) fichiers envoyés, .htaccess mis à jour"
      - name: Écrire la configuration SMTP hors du dossier www
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then echo "Secret SMTP_PASSWORD absent : formulaire de contact pas encore actif"; exit 0; fi
          export CAPTCHA_SECRET=$(openssl rand -hex 32)
          php -r 'echo "<?php\nreturn ".var_export(["smtp_host"=>"smtp.mail.ovh.net","smtp_port"=>465,"smtp_secure"=>"ssl","smtp_user"=>"hello@vip-lift.com","smtp_pass"=>getenv("SMTP_PASSWORD"),"from"=>"hello@vip-lift.com","from_name"=>"Site VIP Lift","to"=>"hello@vip-lift.com","secret"=>getenv("CAPTCHA_SECRET")],true).";\n";' > vip-lift-config.php
          php -l vip-lift-config.php
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; put vip-lift-config.php -o vip-lift-config.php"
          rm -f vip-lift-config.php
      - name: Vérifier la page d'accueil
        run: |
          sleep 5
          sleep 10
          code=$(curl -sL -o accueil.html -w "%{http_code} %{url_effective}" "https://vip-lift.com/?v=$(date +%s)")
          if grep -q "Votre maison peut prendre de la hauteur" accueil.html; then echo "::notice title=Vérification::Nouvelle page d'accueil en ligne (HTTP $code)"; else echo "::error title=Vérification::HTTP $code - $(grep -o '<title>[^<]*' accueil.html | head -1)"; exit 1; fi
          r1=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" https://vip-lift.com/home-lift-electrique-ou-hydraulique-quelles-differences-pour-une-villa/)
          echo "::notice title=Redirections::ancien article -> $r1 | www -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://www.vip-lift.com/) | partenaire -> $(curl -sL -o /dev/null -w '%{http_code}' https://vip-lift.com/devenir-partenaire/) | mentions -> $(curl -sL -o /dev/null -w '%{http_code}' https://vip-lift.com/mentions-legales/)"
