name: 2 - Mise en ligne (nouvelle page d'accueil)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez OUI pour mettre la nouvelle page en ligne"
        required: true
jobs:
  bascule:
    if: ${{ github.event.inputs.confirmation == 'OUI' }}
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Sauvegarder le .htaccess actuel et la liste des fichiers
        run: |
          mkdir -p sauvegarde
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; cd www; cls -1a > ../sauvegarde/liste-www.txt; get -e .htaccess -o sauvegarde/htaccess-avant.txt" || true
          touch sauvegarde/htaccess-avant.txt
          cat sauvegarde/liste-www.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-avant-mise-en-ligne
          path: sauvegarde/
          retention-days: 90
      - name: Vérifier qu'aucun fichier existant ne sera écrasé
        run: |
          if ! grep -qx ".vip-lift-site" sauvegarde/liste-www.txt; then
            for f in index.html style.css script.js liens.js devis-api.php img/; do
              if grep -qx "$f" sauvegarde/liste-www.txt || grep -qx "${f%/}" sauvegarde/liste-www.txt; then
                echo "ARRÊT : www/$f existe déjà sur le site. Rien n'a été modifié."; exit 1
              fi
            done
          fi
      - name: Préparer le nouveau .htaccess
        run: |
          if grep -q "# BEGIN VIP Lift" sauvegarde/htaccess-avant.txt; then
            cp sauvegarde/htaccess-avant.txt htaccess-nouveau.txt
          else
            { cat mise-en-ligne/A-AJOUTER-EN-HAUT-DU-HTACCESS.txt; echo; cat sauvegarde/htaccess-avant.txt; } > htaccess-nouveau.txt
          fi
          head -12 htaccess-nouveau.txt
      - name: Envoyer les fichiers et activer la nouvelle page
        run: |
          echo "fichiers VIP Lift" > marqueur.txt
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mirror -R --verbose --no-perms --exclude-glob A-AJOUTER-EN-HAUT-DU-HTACCESS.txt mise-en-ligne www; put marqueur.txt -o www/.vip-lift-site; put htaccess-nouveau.txt -o www/.htaccess"
      - name: Vérifier la page d'accueil
        run: |
          sleep 5
          curl -s https://www.vip-lift.com/ | grep -q "Votre maison peut prendre de la hauteur" && echo "OK : la nouvelle page est en ligne" || (echo "ATTENTION : la page d'accueil ne montre pas encore la nouvelle version (cache ?)" && exit 1)
