name: 0 - Diagnostic (lecture seule)
on:
  push:
    branches: [diagnostic]
  workflow_dispatch:
jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Lister les dossiers de l'hébergement
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          L() { lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; $1" 2>&1 | head -40 | tr '\n' ' '; }
          echo "::notice title=viplift/::$(L 'cls -1a viplift')"
          echo "::notice title=www/::$(L 'cls -1a www')"
          echo "::notice title=.ovhconfig::$(L 'cat .ovhconfig')"
          echo "::notice title=page 404::$(curl -sL https://vip-lift.com/nouveau/ | grep -o '<title>[^<]*' | head -1)"
          echo "::notice title=accueil::$(curl -sIL https://vip-lift.com/ | grep -i -E '^(HTTP|server|x-powered|link)' | tr '\n' ' ')"
          echo "::notice title=budget (relais devis-api)::$(curl -s -X POST -H 'Origin: https://www.vip-lift.com' -H 'Content-Type: application/json' 'https://www.vip-lift.com/nouveau/devis-api.php?r=estimate' -d '{"levels":3,"emplacement":"INTERIEUR","produit":"HOME_LIFT_AVEC_CHARPENTE","wilaya":"Alger"}' | head -c 300)"
          echo "::notice title=captcha contact::$(curl -s -H 'Origin: https://www.vip-lift.com' 'https://www.vip-lift.com/nouveau/contact-api.php?captcha=1' | head -c 200)"
          echo "::notice title=config SMTP::$(lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; cls -l vip-lift-config.php" 2>&1 | head -2 | tr '\n' ' ')"
          echo "::notice title=Budgets::$(python3 outils/budgets.py | head -c 3000)"
          echo "::notice title=Relais Batna::$(curl -s -X POST -H 'Origin: https://vip-lift.com' -H 'Content-Type: application/json' 'https://vip-lift.com/devis-api.php?r=estimate' -d '{"levels":"3","emplacement":"INTERIEUR","produit":"HOME_LIFT_HYDRAULIQUE","wilaya":"Batna"}' | head -c 300)"
