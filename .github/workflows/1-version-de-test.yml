name: 1 - Version de test (vip-lift.com/nouveau)
on:
  push:
    branches: [main]
    paths: ['nouveau/**', '.github/workflows/1-version-de-test.yml']
  workflow_dispatch:
jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Envoyer le dossier nouveau sur OVH
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          [ -n "$FTP_SERVER" ] || echo "::error title=Secret manquant::FTP_SERVER est vide"
          [ -n "$FTP_USER" ] || echo "::error title=Secret manquant::FTP_USER est vide"
          [ -n "$FTP_PASSWORD" ] || echo "::error title=Secret manquant::FTP_PASSWORD est vide"
          set +e
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 20; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; rm -r -f www/nouveau; mkdir -p -f viplift/nouveau; mirror -R --verbose --no-perms nouveau viplift/nouveau" > lftp.log 2>&1
          code=$?
          cat lftp.log
          echo "::notice title=Dossiers FTP::$(head -12 lftp.log | tr '\n' ' ')"
          if [ $code -ne 0 ]; then echo "::error title=Envoi FTP::$(tail -6 lftp.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=Envoi FTP::$(grep -c 'Transferring file' lftp.log) fichiers envoyés"
      - name: Écrire la configuration SMTP hors du dossier www
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          if [ -z "$SMTP_PASSWORD$RELAY_SECRET" ]; then echo "Aucun secret : configuration non écrite"; exit 0; fi
          [ -n "$RELAY_SECRET" ] && echo "::notice title=Relais devis::secret RELAY_SECRET présent (${#RELAY_SECRET} caractères)" || echo "::warning title=Relais devis::secret RELAY_SECRET absent"
          export CAPTCHA_SECRET=$(openssl rand -hex 32)
          php -r 'echo "<?php\nreturn ".var_export(["smtp_host"=>"smtp.mail.ovh.net","smtp_port"=>465,"smtp_secure"=>"ssl","smtp_user"=>"hello@vip-lift.com","smtp_pass"=>getenv("SMTP_PASSWORD"),"from"=>"hello@vip-lift.com","from_name"=>"Site VIP Lift","to"=>"hello@vip-lift.com","secret"=>getenv("CAPTCHA_SECRET"),"relay_secret"=>(string)getenv("RELAY_SECRET")],true).";\n";' > vip-lift-config.php
          php -l vip-lift-config.php
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; put vip-lift-config.php -o vip-lift-config.php; chmod 600 vip-lift-config.php"
          rm -f vip-lift-config.php
      - name: Vérifier la page
        run: |
          sleep 5
          code=$(curl -sL -o page.html -w "%{http_code} %{url_effective}" https://www.vip-lift.com/nouveau/)
          if grep -q "Votre maison peut prendre de la hauteur" page.html; then echo "::notice title=Vérification::https://www.vip-lift.com/nouveau/ est en ligne (HTTP $code)"; else echo "::error title=Vérification::HTTP $code - $(head -c 300 page.html | tr '\n' ' ')"; exit 1; fi
