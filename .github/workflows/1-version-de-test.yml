name: 1 - Version de test (www/nouveau)
on:
  push:
    branches: [main]
    paths: ['nouveau/**']
  workflow_dispatch:
jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Envoyer le dossier nouveau sur OVH
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-allow true; set ssl:verify-certificate no; set net:max-retries 2; open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mkdir -p -f www/nouveau; mirror -R --verbose --no-perms nouveau www/nouveau"
      - name: Vérifier la page
        run: |
          sleep 5
          curl -s https://www.vip-lift.com/nouveau/ | grep -q "Votre maison peut prendre de la hauteur" && echo "OK : https://www.vip-lift.com/nouveau/ répond" || (echo "La page ne répond pas encore" && exit 1)
