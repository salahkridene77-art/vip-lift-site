<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 262" role="img" aria-label="Position du panneau de commande pour un utilisateur en fauteuil roulant" style="font-family:'Plus Jakarta Sans',Arial,sans-serif">
