<rect width="480" height="262" rx="18" fill="#fff"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">Commandes accessibles en fauteuil roulant</text><rect x="52" y="64" width="190" height="150" fill="#eef3f8" stroke="#0b1630" stroke-width="2"/><rect x="50" y="96" width="6" height="86" fill="#fff"/><line x1="12" y1="139" x2="82" y2="139" stroke="#5b6678" stroke-width="3" marker-end="url(#ar)"/><rect x="112" y="112" width="70" height="54" rx="10" fill="#fff" stroke="#5b6678" stroke-width="2"/><circle cx="124" cy="139" r="10" fill="none" stroke="#5b6678" stroke-width="2"/><rect x="58" y="70" width="12" height="40" rx="3" fill="#d0453b"/><text x="147" y="240" font-size="14" font-weight="700" fill="#d0453b" text-anchor="middle">Près de la porte : difficile</text><rect x="272" y="64" width="190" height="150" fill="#eef3f8" stroke="#0b1630" stroke-width="2"/><rect x="270" y="96" width="6" height="86" fill="#fff"/><line x1="232" y1="139" x2="302" y2="139" stroke="#5b6678" stroke-width="3" marker-end="url(#ar)"/><rect x="332" y="112" width="70" height="54" rx="10" fill="#fff" stroke="#5b6678" stroke-width="2"/><circle cx="344" cy="139" r="10" fill="none" stroke="#5b6678" stroke-width="2"/><rect x="332" y="66" width="80" height="12" rx="3" fill="#2e9d5b"/><text x="367" y="240" font-size="14" font-weight="700" fill="#2e9d5b" text-anchor="middle">Sur le côté : facile</text></svg>