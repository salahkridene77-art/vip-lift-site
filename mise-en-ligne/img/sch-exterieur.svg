<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-label="Fosse d'un Home Lift installé à l'extérieur : drain et protections" style="font-family:'Plus Jakarta Sans',Arial,sans-serif">
<title>Fosse d'un Home Lift installé à l'extérieur : drain et protections</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6ebf1"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa6b5" stroke-width="1.6"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1630"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6391"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9d5b"/></marker></defs>
<rect width="480" height="460" rx="18" fill="#fff"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">Drain au centre de la fosse</text><text x="24" y="60" font-size="14.5" font-weight="500" fill="#5b6678" text-anchor="start">Évacuation des eaux de pluie</text><path d="M30 96 H130 V130 H220 V170 H244 V130 H340 V96 H450 V186 H30Z" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><line x1="232" y1="128" x2="232" y2="190" stroke="#0b6391" stroke-width="3" marker-end="url(#arb)"/><text x="256" y="206" font-size="15" font-weight="700" fill="#0b6391" text-anchor="start">drain</text><line x1="20" y1="226" x2="460" y2="226" stroke="#c9d3df"/><text x="24" y="258" font-size="17" font-weight="700" fill="#0b1630" text-anchor="start">Protections possibles contre le ruissellement</text><path d="M24 330 H42 Q50 306 58 316 V330 H124 V316 Q132 306 140 330 H158 V350 H24Z" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><text x="91" y="382" font-size="14" font-weight="700" fill="#0b1630" text-anchor="middle">Rebord</text><path d="M173 330 H193 V306 H287 V330 H307 V350 H173Z" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><text x="240" y="382" font-size="14" font-weight="700" fill="#0b1630" text-anchor="middle">Socle surélevé</text><path d="M322 330 H336 V292 H350 V316 H428 V292 H442 V330 H456 V350 H322Z" fill="url(#hatch)" stroke="#0b1630" stroke-width="2"/><text x="389" y="382" font-size="14" font-weight="700" fill="#0b1630" text-anchor="middle">Fosse surélevée</text><text x="24" y="418" font-size="14" font-weight="500" fill="#5b6678" text-anchor="start">En zone inondable : un capteur d’eau peut renvoyer</text><text x="24" y="438" font-size="14" font-weight="500" fill="#5b6678" text-anchor="start">la cabine au dernier niveau (selon le modèle).</text></svg>